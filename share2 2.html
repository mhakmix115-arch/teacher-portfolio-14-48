<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشاركة ملف الإنجاز</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--g:#075b45;--g2:#0d6a54;--gold:#c7a34b;--cream:#f8f1e5;--line:#e4d4ad;--txt:#173d34}
*{box-sizing:border-box}body{margin:0;font-family:"Geeza Pro","Noto Naskh Arabic",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#fffaf2,#f5ead7);color:var(--txt)}
.wrap{width:min(94%,820px);margin:28px auto}.card{background:#fffdf8;border:2px solid var(--gold);border-radius:26px;padding:18px;box-shadow:0 12px 36px rgba(68,48,18,.10)}
h1{margin:0 0 6px;color:var(--g);font-size:27px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.backbtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--gold);border-radius:12px;padding:8px 12px;color:var(--g);font-weight:800;background:#fff}.sub{color:#756a5d;line-height:1.8;margin-bottom:16px}
.grid{display:grid;gap:12px}.field label{display:block;font-weight:800;margin-bottom:6px;color:var(--g)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit}
textarea{min-height:100px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{border:0;border-radius:13px;padding:11px 16px;background:var(--g);color:white;font-weight:800;font:inherit}.btn.alt{background:white;color:var(--g);border:1px solid var(--gold)}
#qr{display:grid;place-items:center;min-height:220px;background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:14px;padding:12px}
.url{direction:ltr;text-align:left;word-break:break-all;background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:9px;font-size:11px;margin-top:10px}
.hidden{display:none!important}.files{display:grid;gap:8px;margin-top:10px}.file{border:1px solid var(--line);border-radius:13px;background:white;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.file a{color:var(--g);font-weight:800;text-decoration:none}
.badge{display:inline-block;background:#f1e7cf;color:var(--g);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.ok{background:#edf8f3;border:1px solid #b9dfd1;border-radius:13px;padding:10px;margin-top:10px}.err{background:#fff2ef;border:1px solid #e6b5aa;border-radius:13px;padding:10px;margin-top:10px}
canvas.sig{width:100%;height:150px;background:white;border:1px dashed var(--gold);border-radius:14px;touch-action:none}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}

.fixed-return{
  position:fixed;
  top:calc(10px + env(safe-area-inset-top));
  left:12px;
  z-index:9999;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-decoration:none;
  border:1px solid var(--gold);
  border-radius:999px;
  padding:9px 13px;
  background:#fffdf8;
  color:var(--g);
  font-weight:900;
  box-shadow:0 5px 18px rgba(0,0,0,.12)
}

</style>
</head>
<body>
<a class="fixed-return" href="javascript:history.back()">← العودة لملف الإنجاز</a>
<div class="wrap">
  <div class="card" id="teacherView">
    <div class="topbar"><h1>🔗 المشاركة بالباركود</h1><a class="backbtn" href="javascript:history.back()">← العودة لملف الإنجاز</a></div>
    <div class="sub">صفحة مستقلة عن ملف الإنجاز. اختاري القسم، نوع الزائر، وأرفقي الملفات المراد مراجعتها.</div>

    <div id="loginBox" class="hidden">
      <div class="ok">يجب تسجيل دخول المعلمة أولًا.</div>
      <div class="actions"><button class="btn" onclick="loginMicrosoft()">الدخول بحساب Microsoft</button></div>
    </div>

    <div id="creatorBox">
      <div class="grid two">
        <div class="field"><label>القسم</label><select id="section"></select></div>
        <div class="field"><label>نوع الدخول</label>
          <select id="role"><option value="admin">🏫 الإدارة / المشرفة</option><option value="family">👨‍👩‍👧 الأسرة / الزائرة</option></select>
        </div>
        <div class="field"><label>مدة الرابط</label>
          <select id="days"><option value="1">يوم</option><option value="3">3 أيام</option><option value="7" selected>7 أيام</option><option value="14">14 يومًا</option><option value="30">30 يومًا</option></select>
        </div>
        <div class="field"><label>إرفاق ملفات للمراجعة</label><input id="files" type="file" multiple></div>
      </div>
      <div class="field" style="margin-top:12px"><label>ملاحظة للزائر (اختياري)</label><textarea id="note" placeholder="مثال: يرجى مراجعة الخطة واعتمادها."></textarea></div>
      <div class="actions"><button class="btn" onclick="createShare()">إنشاء الرابط والباركود</button></div>
      <div id="msg"></div>
      <div id="qr"><span style="color:#756a5d">سيظهر الباركود هنا</span></div>
      <div id="url" class="url hidden"></div>
      <div class="actions">
        <button id="copyBtn" class="btn alt hidden" onclick="copyLink()">نسخ الرابط</button>
        <button id="sendBtn" class="btn alt hidden" onclick="sendLink()">إرسال الرابط</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="guestView">
    <div class="topbar"><span class="badge" id="guestBadge"></span><a class="backbtn" href="javascript:history.back()">← العودة لملف الإنجاز</a></div>
    <h1 id="guestTitle" style="margin-top:10px">ملف للمراجعة</h1>
    <div class="sub" id="guestMeta"></div>
    <div class="field"><label>ملاحظة المعلمة</label><div id="guestNote" class="ok"></div></div>
    <div class="field" style="margin-top:14px"><label>الملفات</label><div id="guestFiles" class="files"></div></div>

    <div id="adminForm" class="hidden" style="margin-top:18px">
      <h1 style="font-size:21px">✅ اعتماد الإدارة</h1>
      <div class="grid">
        <input id="adminName" placeholder="اسم المديرة / المشرفة">
        <select id="adminStatus"><option value="approved">معتمد</option><option value="needs_changes">يحتاج تعديل</option></select>
        <textarea id="adminNote" placeholder="الملاحظة"></textarea>
        <label><b>التوقيع</b></label>
        <canvas id="sig" class="sig" width="700" height="220"></canvas>
        <button class="btn alt" onclick="clearSig()">مسح التوقيع</button>
        <label><b>الختم (اختياري)</b></label><input id="stamp" type="file" accept="image/*">
        <button class="btn" onclick="submitApproval()">حفظ الاعتماد</button>
      </div>
    </div>

    <div id="familyForm" class="hidden" style="margin-top:18px">
      <h1 style="font-size:21px">💬 مشاركة الأسرة / الزائرة</h1>
      <div class="grid">
        <input id="familyName" placeholder="الاسم">
        <textarea id="familyNote" placeholder="الرأي أو التوصية"></textarea>
        <button class="btn" onclick="submitFamily()">إرسال</button>
      </div>
    </div>
    <div id="guestMsg"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://hfsfuyzxduinaekllipc.supabase.co';
const SUPABASE_KEY='sb_publishable_E9uCMJvYUiY-YZZJCeV12w_oNhomoqk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const sections=["البيانات الشخصية","السيرة الذاتية","الرؤية والرسالة","الأهداف","الخطة السنوية","الوحدات التعليمية","التحضير","استراتيجيات التعليم","إنجازات الأطفال","ملاحظات الأطفال","التوجيه الصحي","الاستبيانات","التقويم الذاتي","التقويم الخارجي","الأداء الوظيفي","ملفات وشواهد","الدورات التدريبية","الشهادات","الفيديوهات","الصور","الشراكة المجتمعية","ملاحظات الإدارة","ملاحظات الأسرة","صورتي وشهاداتي"];
let shareUrl='', guest=null;

function setMsg(id,txt,ok=false){document.getElementById(id).innerHTML=txt?`<div class="${ok?'ok':'err'}">${txt}</div>`:''}
function initSections(){document.getElementById('section').innerHTML=sections.map((s,i)=>`<option value="${s}">${i+1}. ${s}</option>`).join('')}
async function loginMicrosoft(){
  const {error}=await sb.auth.signInWithOAuth({provider:'azure',options:{redirectTo:location.origin+location.pathname}});
  if(error) alert('تعذر تسجيل الدخول');
}
async function teacherState(){
  const {data:{session}}=await sb.auth.getSession();
  document.getElementById('loginBox').classList.toggle('hidden',!!session);
  document.getElementById('creatorBox').classList.toggle('hidden',!session);
}
async function createShare(){
  setMsg('msg','');
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return teacherState();
    const role=document.getElementById('role').value, title=document.getElementById('section').value, days=Number(document.getElementById('days').value);
    const snapshot={text:document.getElementById('note').value.trim()};
    const {data,error}=await sb.rpc('create_share_link',{p_role:role,p_section:title,p_title:title,p_snapshot:snapshot,p_days:days});
    if(error) throw error;
    const token=data.token, shareId=data.id;
    const picked=[...document.getElementById('files').files];
    for(const f of picked){
      const path=`${session.user.id}/${token}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${f.name.replace(/[^\w\u0600-\u06FF.\-]+/g,'_')}`;
      const {error:uerr}=await sb.storage.from('shared-artifacts').upload(path,f,{contentType:f.type||'application/octet-stream'});
      if(uerr) throw uerr;
      const {data:signed,error:serr}=await sb.storage.from('shared-artifacts').createSignedUrl(path,days*86400);
      if(serr) throw serr;
      const {error:ierr}=await sb.from('share_items').insert({share_id:shareId,file_name:f.name,mime_type:f.type||null,public_url:signed.signedUrl});
      if(ierr) throw ierr;
    }
    shareUrl=location.origin+location.pathname+'?share='+encodeURIComponent(token);
    document.getElementById('qr').innerHTML='';
    new QRCode(document.getElementById('qr'),{text:shareUrl,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
    document.getElementById('url').textContent=shareUrl;document.getElementById('url').classList.remove('hidden');
    document.getElementById('copyBtn').classList.remove('hidden');document.getElementById('sendBtn').classList.remove('hidden');
    setMsg('msg','تم إنشاء رابط المشاركة بنجاح.',true);
  }catch(e){console.error(e);setMsg('msg','تعذر إنشاء الرابط. أرسلي صورة الخطأ إن ظهر.');}
}
async function copyLink(){await navigator.clipboard.writeText(shareUrl);alert('تم نسخ الرابط')}
async function sendLink(){if(navigator.share){try{return await navigator.share({title:'مشاركة ملف الإنجاز',url:shareUrl})}catch(e){}}return copyLink()}

async function loadGuest(token){
  document.getElementById('teacherView').classList.add('hidden');document.getElementById('guestView').classList.remove('hidden');
  try{
    const {data,error}=await sb.rpc('resolve_share_link_v2',{p_token:token});
    if(error) throw error;if(!data?.valid) throw new Error('invalid');
    guest={...data,token};
    document.getElementById('guestBadge').textContent=data.role==='admin'?'🏫 الإدارة / المشرفة':'👨‍👩‍👧 الأسرة / الزائرة';
    document.getElementById('guestTitle').textContent=data.title||'ملف للمراجعة';
    document.getElementById('guestMeta').textContent='صالح حتى: '+new Date(data.expires_at).toLocaleString('ar-SA');
    document.getElementById('guestNote').textContent=data.snapshot?.text||'لا توجد ملاحظة.';
    const items=data.items||[];
    document.getElementById('guestFiles').innerHTML=items.length?items.map(f=>`<div class="file"><b>${f.file_name}</b><a target="_blank" rel="noopener" href="${f.public_url}">فتح الملف</a></div>`).join(''):'<div class="ok">لا توجد ملفات مرفقة.</div>';
    document.getElementById('adminForm').classList.toggle('hidden',data.role!=='admin');
    document.getElementById('familyForm').classList.toggle('hidden',data.role!=='family');
    if(data.role==='admin') setupSig();
  }catch(e){setMsg('guestMsg','الرابط غير متاح أو منتهي.');}
}
function setupSig(){const c=document.getElementById('sig'),ctx=c.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#173d34';let d=false;
function p(e){const r=c.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)}}
c.onpointerdown=e=>{d=true;const a=p(e);ctx.beginPath();ctx.moveTo(a.x,a.y)};c.onpointermove=e=>{if(!d)return;const a=p(e);ctx.lineTo(a.x,a.y);ctx.stroke()};window.onpointerup=()=>d=false}
function clearSig(){const c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height)}
async function fileData(input){const f=input.files?.[0];if(!f)return null;return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function submitApproval(){
  try{
    const name=document.getElementById('adminName').value.trim();if(!name)return alert('اكتبي الاسم');
    const sig=document.getElementById('sig').toDataURL('image/png'), stamp=await fileData(document.getElementById('stamp'));
    const {error}=await sb.rpc('submit_share_response',{p_token:guest.token,p_type:'approval',p_name:name,p_status:document.getElementById('adminStatus').value,p_note:document.getElementById('adminNote').value.trim(),p_signature:sig,p_stamp:stamp});
    if(error)throw error;setMsg('guestMsg','تم إرسال الاعتماد للمعلمة.',true);
  }catch(e){setMsg('guestMsg','تعذر حفظ الاعتماد.');}
}
async function submitFamily(){
  try{
    const note=document.getElementById('familyNote').value.trim();if(!note)return alert('اكتبي التوصية');
    const {error}=await sb.rpc('submit_share_response',{p_token:guest.token,p_type:'recommendation',p_name:document.getElementById('familyName').value.trim()||'زائرة',p_status:'submitted',p_note:note,p_signature:null,p_stamp:null});
    if(error)throw error;setMsg('guestMsg','تم إرسال التوصية.',true);
  }catch(e){setMsg('guestMsg','تعذر إرسال التوصية.');}
}
initSections();
const token=new URLSearchParams(location.search).get('share');
if(token) loadGuest(token); else teacherState();
</script>
</body></html>
