<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b45">
<title>ملف الإنجاز المهني</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f8f1e5;font-family:Tahoma,Arial,sans-serif;color:#075b45}
body.cover-open{overflow:hidden}
#cover{position:fixed;inset:0;z-index:100;background:#f8f1e5;overflow:hidden;display:flex;align-items:stretch;justify-content:center}
#cover img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.cover-tap{position:absolute;left:50%;bottom:2.8%;transform:translateX(-50%);width:58%;height:11%;border:0;background:transparent}
#portfolio{display:none;min-height:100vh;background:#f8f1e5}
.home{position:fixed;z-index:30;left:14px;top:max(14px,env(safe-area-inset-top));width:54px;height:54px;border-radius:50%;border:2px solid #c69a3b;background:#075b45;color:white;font-size:26px}
.inner{width:100%;margin:0;padding:0}
.inner img{display:block;width:100%;height:auto;margin:0;padding:0}
.heading{text-align:center;font-size:26px;margin:22px 0 14px}
.grid{width:94%;margin:0 auto 40px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;min-height:108px;border:1.5px solid #d6b66c;border-radius:20px;background:#fffaf0;padding:14px;display:flex;align-items:center;gap:10px;text-align:right;color:#075b45}
.icon{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;background:#075b45;color:#e7c86e;border:2px solid #d5af56;font-size:23px}
.num{position:absolute;top:8px;left:10px;color:#b88a32;font-weight:700}
.card strong{display:block;font-size:15px}
.card small{display:block;color:#716658;font-size:11px;margin-top:4px}
.panel{display:none;position:fixed;inset:0;z-index:200;background:#f8f1e5;overflow:auto;padding:80px 18px 30px}
.panel.open{display:block}
.back{border:0;border-radius:12px;background:#075b45;color:white;padding:10px 16px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body class="cover-open">
<section id="cover">
  <img src="cover-main.jpg" alt="غلاف ملف الإنجاز">
  <button class="cover-tap" onclick="enterPortfolio()" aria-label="الدخول إلى ملف الإنجاز"></button>
</section>

<section id="portfolio">
  <button class="home" onclick="showCover()">⌂</button>
  <div class="inner"><img src="inner-main.jpg" alt="الواجهة الداخلية"></div>
  <h2 class="heading">أقسام ملف الإنجاز</h2>
  <div class="grid" id="grid"></div>
</section>

<div class="panel" id="panel">
  <button class="back" onclick="closePanel()">العودة للأقسام</button>
  <h2 id="panelTitle"></h2>
  <p>هذا القسم جاهز للمرحلة التالية: الإضافة والتعديل والحذف ورفع الملفات والصور والفيديوهات.</p>
</div>

<script>
const sections=[
["👤","البيانات الشخصية","المعلومات والبيانات الشخصية"],
["📄","السيرة الذاتية","المؤهلات والخبرات والدورات والمهارات"],
["🌿","الرؤية والرسالة","الرؤية والرسالة المهنية"],
["🎯","الأهداف","الأهداف المهنية والتعليمية"],
["🗓️","الخطة السنوية","الخطة السنوية والتنفيذ والمتابعة"],
["📚","الوحدات التعليمية","الوحدات والخطط والأنشطة والتقارير"],
["✏️","التحضير","التحضير اليومي والأسبوعي"],
["🧠","الاستراتيجيات","استراتيجيات التعليم والتعلم"],
["🧩","الوسائل التعليمية","الوسائل والأدوات التعليمية"],
["🏆","إنجازات الأطفال","الأعمال والمشاريع والخطط والبرامج"],
["📝","ملاحظات الأطفال","الملاحظات والمتابعة والتقدم"],
["🎨","الأنشطة","الأنشطة الصفية واللاصفية"],
["🎉","المناسبات","المناسبات والفعاليات والتوثيق"],
["💡","المبادرات","المبادرات وقياس الأثر"],
["🤝","الشراكة المجتمعية","الشراكات والتعاون المجتمعي"],
["❤️","التوجيه الصحي","الخطط والبرامج والبيئة المدرسية والصفية"],
["📋","تقارير التوجيه الصحي","التقارير الدورية والختامية"],
["🥇","المسابقات الصحية","المسابقات والنتائج والشواهد"],
["🎓","الدورات التدريبية","الدورات وورش العمل"],
["📜","الشهادات","الشهادات والتكريمات"],
["🖼️","الشواهد والصور","الصور والفيديوهات والوثائق"],
["✍️","ملاحظات الإدارة والمشرفات","الملاحظات والتوقيع والختم والاعتماد"],
["👨‍👩‍👧","مشاركة الأسرة","المشاركة والمتابعة والملاحظات"],
["📑","التقارير الختامية","التقارير الختامية والنتائج والتوصيات"]
];
const ar="٠١٢٣٤٥٦٧٨٩";
const num=n=>String(n).replace(/\d/g,d=>ar[d]);
const grid=document.getElementById("grid");
sections.forEach((s,i)=>{
 const b=document.createElement("button");
 b.className="card";
 b.innerHTML=`<span class="icon">${s[0]}</span><span><strong>${s[1]}</strong><small>${s[2]}</small></span><span class="num">${num(i+1)}</span>`;
 b.onclick=()=>openPanel(s[1]);
 grid.appendChild(b);
});
function enterPortfolio(){document.getElementById("cover").style.display="none";document.getElementById("portfolio").style.display="block";document.body.classList.remove("cover-open");scrollTo(0,0)}
function showCover(){document.getElementById("portfolio").style.display="none";document.getElementById("cover").style.display="flex";document.body.classList.add("cover-open");scrollTo(0,0)}
function openPanel(t){document.getElementById("panelTitle").textContent=t;document.getElementById("panel").classList.add("open")}
function closePanel(){document.getElementById("panel").classList.remove("open")}
</script>
</body>
</html>
