<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b45">
<title>ملف الإنجاز المهني</title>
<style>
:root{--green:#075b45;--green2:#0d6a54;--gold:#c7a34b;--cream:#f8f1e5;--card:#fffaf2;--text:#173d34;--muted:#6f6558}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);font-family:"Geeza Pro","Noto Naskh Arabic","Tahoma",Arial,sans-serif;color:var(--text)}button{font:inherit}
body.cover-open{overflow:hidden}
#cover{position:fixed;inset:0;z-index:50;background:#f7efdf;display:grid;place-items:center;overflow:hidden}
.cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.cover-shade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 74%,rgba(248,241,229,.25) 86%,rgba(248,241,229,.82) 100%);pointer-events:none}
.enter-btn{position:absolute;z-index:2;left:50%;bottom:max(34px,calc(env(safe-area-inset-bottom) + 22px));transform:translateX(-50%);min-width:280px;max-width:86vw;border:2px solid var(--gold);border-radius:999px;background:var(--green);color:white;padding:14px 28px;font-size:20px;font-weight:700;box-shadow:0 8px 22px #0002}
#portfolio{display:none;min-height:100dvh;background:var(--cream);padding-bottom:40px}
.home-btn{position:fixed;z-index:25;top:max(14px,env(safe-area-inset-top));left:14px;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:var(--green);color:#fff;font-size:27px;box-shadow:0 5px 14px #0002}
.inner-hero{width:100%;margin:0 auto;background:var(--cream);overflow:hidden}
.inner-img{display:block;width:100%;height:auto;max-width:1080px;margin:0 auto}
.section-heading{width:min(94%,860px);margin:22px auto 12px;text-align:center;color:var(--green);font-size:24px;font-weight:800}.section-heading:after{content:"";display:block;width:100px;height:2px;background:var(--gold);margin:8px auto 0}
.sections{width:min(94%,860px);margin:0 auto 42px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1.5px solid #d8b96f;border-radius:22px;background:rgba(255,250,242,.97);padding:13px 11px;min-height:108px;display:flex;align-items:center;gap:10px;text-align:right;color:var(--green);box-shadow:0 5px 14px rgba(95,69,23,.08)}
.icon{flex:0 0 45px;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#f0d47e;border:2px solid var(--gold);font-size:21px}.copy{min-width:0}.title{font-size:16px;font-weight:800;line-height:1.4}.num{color:var(--gold);font-weight:800;margin-left:4px}.desc{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:4px}
.panel{display:none;position:fixed;inset:0;z-index:60;background:var(--cream);overflow:auto;padding:max(74px,calc(env(safe-area-inset-top) + 64px)) 16px 30px}.panel.active{display:block}.panel-box{max-width:820px;margin:auto;background:var(--card);border:1.5px solid #d8b96f;border-radius:24px;padding:20px;box-shadow:0 8px 24px #0001}.back{border:0;border-radius:999px;background:var(--green);color:#fff;padding:10px 17px;font-weight:700}.panel h2{color:var(--green);margin:18px 0 6px}.panel p{color:var(--muted);line-height:1.8}.editor{width:100%;min-height:130px;border:1px solid #d8c79d;border-radius:15px;padding:12px;background:white;font:inherit;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action{border:1px solid var(--gold);border-radius:999px;background:var(--green);color:white;padding:9px 14px}.upload{display:inline-block;cursor:pointer}.upload input{display:none}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.gallery img,.gallery video{width:100%;border-radius:14px;border:1px solid #e1d3b0}.file-link{display:block;background:#fff;border:1px solid #e1d3b0;border-radius:12px;padding:10px;margin-top:8px;color:var(--green);text-decoration:none;overflow-wrap:anywhere}

.manage-bar{width:min(94%,860px);margin:0 auto 14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.manage-btn,.mini-btn{border:1px solid var(--gold);border-radius:999px;background:var(--green);color:#fff;padding:9px 14px;font-weight:700}
.manage-panel{display:none;width:min(94%,860px);margin:0 auto 18px;background:var(--card);border:1.5px solid #d8b96f;border-radius:20px;padding:14px}
.manage-panel.active{display:block}
.manage-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px dashed #dfcfaa}
.manage-row:last-child{border-bottom:0}.manage-row input{flex:1;min-width:150px;border:1px solid #d8c79d;border-radius:10px;padding:8px;background:#fff;font:inherit}
.folder-tools{margin:14px 0 8px;display:flex;gap:8px;flex-wrap:wrap}.folder-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.folder-chip{border:1px solid #d8b96f;border-radius:999px;background:#fff;color:var(--green);padding:8px 12px}.folder-chip.active{background:var(--green);color:#fff}
.folder-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;border-radius:12px;background:#f4ead5}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e1d3b0;border-radius:12px;padding:9px;margin-top:8px}.file-actions{display:flex;gap:5px;flex-wrap:wrap}.file-actions button{border:1px solid #d8b96f;border-radius:999px;background:#fff;color:var(--green);padding:5px 8px}.muted-note{color:var(--muted);font-size:12px;margin-top:8px}
@media(max-width:430px){.enter-btn{min-width:250px;font-size:18px}.sections{gap:9px}.card{min-height:102px;padding:10px 8px;gap:8px}.icon{width:41px;height:41px;flex-basis:41px;font-size:19px}.title{font-size:14px}.desc{font-size:10px}.section-heading{font-size:21px}}
@media(min-width:700px){.sections{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body class="cover-open">
<section id="cover">
  <img class="cover-image" src="./portfolio-cover-background-1080x1920.jpg" alt="غلاف ملف الإنجاز">
  <div class="cover-shade"></div>
  <button class="enter-btn" type="button" onclick="openPortfolio()">الدخول إلى ملف الإنجاز</button>
</section>
<section id="portfolio">
  <button class="home-btn" type="button" onclick="goCover()" aria-label="العودة للغلاف">⌂</button>
  <div class="inner-hero"><img class="inner-img" src="./portfolio-inner-background-1080x1920.jpg" alt="الواجهة الداخلية"></div>
  <div class="section-heading">أقسام ملف الإنجاز</div>
  <div class="manage-bar"><button class="manage-btn" type="button" onclick="toggleSectionManager()">⚙️ إدارة الأقسام</button></div>
  <div class="manage-panel" id="sectionManager"><div class="actions"><button class="action" type="button" onclick="addSection()">＋ إضافة قسم جديد</button></div><div id="sectionManagerList"></div></div>
  <div class="sections" id="sections"></div>
</section>
<div class="panel" id="panel"><div class="panel-box">
  <button class="back" onclick="closePanel()">← العودة للأقسام</button>
  <h2 id="panelTitle"></h2><p id="panelDesc"></p>
  <textarea class="editor" id="editor" placeholder="اكتبي محتوى هذا القسم هنا..."></textarea>
  <div class="actions"><button class="action" onclick="saveText()">حفظ النص</button><label class="action upload">رفع صور / فيديو / ملفات<input id="fileInput" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip" onchange="addFiles(event)"></label><button class="action" onclick="clearSection()">حذف محتوى القسم</button></div>
  <div class="folder-tools"><button class="mini-btn" type="button" onclick="createFolder()">＋ إنشاء مجلد</button><button class="mini-btn" type="button" onclick="renameCurrentFolder()">✏️ تغيير اسم المجلد</button><button class="mini-btn" type="button" onclick="deleteCurrentFolder()">🗑️ حذف المجلد</button></div>
  <div class="folder-list" id="folderList"></div><div class="folder-head"><strong id="folderTitle">ملفات القسم</strong><span class="muted-note">يمكن نقل الملفات وترتيبها داخل المجلدات.</span></div>
  <div class="gallery" id="gallery"></div><div id="fileList"></div>
</div></div>
<script>
const DEFAULT_ITEMS=[
["👤","البيانات الشخصية","المعلومات والبيانات الشخصية"],["📄","السيرة الذاتية","المؤهلات والخبرات"],["🎯","الرؤية والرسالة","الرؤية والرسالة المهنية"],["⭐","الأهداف","الأهداف المهنية والتعليمية"],["🗓️","الخطة السنوية","الخطة والتنفيذ والمتابعة"],["📚","الوحدات التعليمية","الوحدات والتقارير الختامية"],["🧩","التحضير","تحضير الأنشطة التعليمية"],["💡","استراتيجيات التعليم","استراتيجيات وأساليب التعلم"],["🏆","إنجازات الأطفال","توثيق إنجازات الأطفال"],["📝","ملاحظات الأطفال","الملاحظات والمتابعة"],["🩺","التوجيه الصحي","تقارير وصور ومسابقات"],["📋","الاستبيانات","استبيانات الأسرة والمنسوبين"],["🪞","التقويم الذاتي","إعداد وتنفيذ التقويم الذاتي"],["👥","التقويم الخارجي","إعداد وتنفيذ التقويم الخارجي"],["📊","الأداء الوظيفي","توثيق ومتابعة الأداء"],["📁","ملفات وشواهد","رفع الملفات والشهادات"],["🎓","الدورات التدريبية","الدورات والتطوير المهني"],["📜","الشهادات","الشهادات وشواهد الإنجاز"],["🎬","الفيديوهات","مقاطع الفيديو والشواهد المرئية"],["🖼️","الصور","الصور والأنشطة"],["🤝","الشراكة المجتمعية","المبادرات والمشاركات"],["💬","ملاحظات الإدارة","ملاحظات المديرة والوكيلة والمشرفات"],["👨‍👩‍👧","ملاحظات الأسرة","ملاحظات الأسرة التعليمية والصحية"],["🌟","صورتي وشهاداتي","صور شخصية وشهادات وشواهد مهنية"]];
let items=JSON.parse(localStorage.getItem('portfolio_sections_v2')||'null')||DEFAULT_ITEMS.map((x,i)=>[...x,{hidden:false,base:true,id:'base_'+i}]);
const arNums=["١","٢","٣","٤","٥","٦","٧","٨","٩","١٠","١١","١٢","١٣","١٤","١٥","١٦","١٧","١٨","١٩","٢٠","٢١","٢٢","٢٣","٢٤","٢٥","٢٦","٢٧","٢٨","٢٩","٣٠","٣١","٣٢","٣٣","٣٤","٣٥","٣٦"];
let currentSection='',currentSectionId='',currentFolderId='root';
function saveSections(){localStorage.setItem('portfolio_sections_v2',JSON.stringify(items))}
function sectionKey(p){return p+'_'+currentSectionId}
function renderCards(){const box=document.getElementById('sections');box.innerHTML='';items.forEach((it,i)=>{const meta=it[3]||{hidden:false,base:true,id:'legacy_'+i};if(meta.hidden)return;const b=document.createElement('button');b.className='card';b.type='button';b.innerHTML=`<span class="icon">${it[0]}</span><span class="copy"><span class="title"><span class="num">${arNums[i]||i+1}.</span>${it[1]}</span><span class="desc">${it[2]}</span></span>`;b.onclick=()=>openPanel(it[1],it[2],meta.id);box.appendChild(b)});renderSectionManager()}
function toggleSectionManager(){document.getElementById('sectionManager').classList.toggle('active');renderSectionManager()}
function renderSectionManager(){const box=document.getElementById('sectionManagerList');if(!box)return;box.innerHTML='';items.forEach((it,i)=>{const meta=it[3];const row=document.createElement('div');row.className='manage-row';row.innerHTML=`<input value="${escapeHtml(it[1])}"><button class="mini-btn">حفظ الاسم</button><button class="mini-btn">${meta.hidden?'إظهار':'إخفاء'}</button><button class="mini-btn">↑</button><button class="mini-btn">↓</button>${meta.base?'':'<button class="mini-btn">حذف</button>'}`;const bs=row.querySelectorAll('button'),inp=row.querySelector('input');bs[0].onclick=()=>renameSection(i,inp.value);bs[1].onclick=()=>toggleSection(i);bs[2].onclick=()=>moveSection(i,-1);bs[3].onclick=()=>moveSection(i,1);if(!meta.base)bs[4].onclick=()=>deleteSection(i);box.appendChild(row)})}
function addSection(){const n=prompt('اكتبي اسم القسم الجديد:');if(!n||!n.trim())return;const d=prompt('وصف مختصر للقسم:')||'قسم مخصص';items.push(['📁',n.trim(),d.trim(),{hidden:false,base:false,id:'custom_'+Date.now()}]);saveSections();renderCards()}
function renameSection(i,n){if(!n.trim())return;items[i][1]=n.trim();saveSections();renderCards()} function toggleSection(i){items[i][3].hidden=!items[i][3].hidden;saveSections();renderCards()} function moveSection(i,d){const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];saveSections();renderCards()} function deleteSection(i){if(items[i][3].base)return;if(!confirm('حذف هذا القسم الجديد؟'))return;items.splice(i,1);saveSections();renderCards()}
function openPortfolio(){document.getElementById('cover').style.display='none';document.getElementById('portfolio').style.display='block';document.body.classList.remove('cover-open');window.scrollTo(0,0)} function goCover(){closePanel();document.getElementById('portfolio').style.display='none';document.getElementById('cover').style.display='grid';document.body.classList.add('cover-open');window.scrollTo(0,0)}
function openPanel(t,d,id){currentSection=t;currentSectionId=id||t;currentFolderId='root';document.getElementById('panelTitle').textContent=t;document.getElementById('panelDesc').textContent=d;document.getElementById('editor').value=localStorage.getItem(sectionKey('text'))||'';renderFolders();loadFiles();document.getElementById('panel').classList.add('active')} function closePanel(){document.getElementById('panel').classList.remove('active')} function saveText(){localStorage.setItem(sectionKey('text'),document.getElementById('editor').value);alert('تم الحفظ')}
function getFolders(){return JSON.parse(localStorage.getItem(sectionKey('folders'))||'[]')} function setFolders(v){localStorage.setItem(sectionKey('folders'),JSON.stringify(v))}
function renderFolders(){const box=document.getElementById('folderList');box.innerHTML='';const root=document.createElement('button');root.className='folder-chip'+(currentFolderId==='root'?' active':'');root.textContent='📂 ملفات القسم';root.onclick=()=>{currentFolderId='root';renderFolders();loadFiles()};box.appendChild(root);getFolders().forEach(f=>{const b=document.createElement('button');b.className='folder-chip'+(currentFolderId===f.id?' active':'');b.textContent='📁 '+f.name;b.onclick=()=>{currentFolderId=f.id;renderFolders();loadFiles()};box.appendChild(b)});const f=getFolders().find(x=>x.id===currentFolderId);document.getElementById('folderTitle').textContent=f?'📁 '+f.name:'📂 ملفات القسم'}
function createFolder(){const n=prompt('اسم المجلد الجديد:');if(!n||!n.trim())return;const a=getFolders();a.push({id:'f_'+Date.now(),name:n.trim()});setFolders(a);currentFolderId=a[a.length-1].id;renderFolders();loadFiles()} function renameCurrentFolder(){if(currentFolderId==='root'){alert('اختاري مجلدًا أولًا.');return}const a=getFolders(),f=a.find(x=>x.id===currentFolderId);const n=prompt('الاسم الجديد:',f.name);if(!n||!n.trim())return;f.name=n.trim();setFolders(a);renderFolders()} function deleteCurrentFolder(){if(currentFolderId==='root'){alert('اختاري مجلدًا أولًا.');return}if(!confirm('حذف المجلد؟ سيتم نقل ملفاته إلى ملفات القسم.'))return;let a=getSavedFiles();a.forEach(x=>{if((x.folder||'root')===currentFolderId)x.folder='root'});setSavedFiles(a);setFolders(getFolders().filter(x=>x.id!==currentFolderId));currentFolderId='root';renderFolders();loadFiles()}
function getSavedFiles(){return JSON.parse(localStorage.getItem(sectionKey('files'))||'[]')} function setSavedFiles(v){localStorage.setItem(sectionKey('files'),JSON.stringify(v))}
function addFiles(e){const incoming=[...e.target.files],saved=getSavedFiles();let i=0;function next(){if(i>=incoming.length){e.target.value='';loadFiles();return}const f=incoming[i++],r=new FileReader();r.onload=()=>{saved.push({id:'file_'+Date.now()+'_'+i,name:f.name,type:f.type||'application/octet-stream',data:r.result,folder:currentFolderId});try{setSavedFiles(saved);next()}catch(err){saved.pop();alert('حجم الملفات أكبر من مساحة المتصفح. للملفات الكبيرة سنستخدم التخزين السحابي.');e.target.value='';loadFiles()}};r.readAsDataURL(f)}next()}
function loadFiles(){const g=document.getElementById('gallery'),l=document.getElementById('fileList');g.innerHTML='';l.innerHTML='';const saved=getSavedFiles();saved.filter(x=>(x.folder||'root')===currentFolderId).forEach(x=>{const i=saved.findIndex(y=>y.id===x.id);if(x.type.startsWith('image/')){const el=document.createElement('img');el.src=x.data;el.alt=x.name;g.appendChild(el)}else if(x.type.startsWith('video/')){const el=document.createElement('video');el.src=x.data;el.controls=true;g.appendChild(el)}const row=document.createElement('div');row.className='file-item';row.innerHTML=`<span>📎 ${escapeHtml(x.name)}</span><span class="file-actions"><button>↑</button><button>↓</button><button>نقل</button><button>حذف</button></span>`;const bs=row.querySelectorAll('button');bs[0].onclick=()=>moveFile(i,-1);bs[1].onclick=()=>moveFile(i,1);bs[2].onclick=()=>moveFileToFolder(i);bs[3].onclick=()=>removeFile(i);l.appendChild(row)})}
function moveFile(i,d){const a=getSavedFiles(),folder=a[i].folder||'root',inds=a.map((x,k)=>(x.folder||'root')===folder?k:-1).filter(k=>k>=0),p=inds.indexOf(i),t=inds[p+d];if(t===undefined)return;[a[i],a[t]]=[a[t],a[i]];setSavedFiles(a);loadFiles()} function moveFileToFolder(i){const a=getSavedFiles(),folders=[{id:'root',name:'ملفات القسم'},...getFolders()],names=folders.map((f,n)=>`${n+1}- ${f.name}`).join('
'),c=Number(prompt('اختاري رقم المجلد:
'+names))-1;if(!folders[c])return;a[i].folder=folders[c].id;setSavedFiles(a);loadFiles()} function removeFile(i){if(!confirm('حذف هذا الملف؟'))return;const a=getSavedFiles();a.splice(i,1);setSavedFiles(a);loadFiles()}
function clearSection(){if(!confirm('حذف محتوى هذا القسم بالكامل؟'))return;localStorage.removeItem(sectionKey('text'));localStorage.removeItem(sectionKey('files'));localStorage.removeItem(sectionKey('folders'));document.getElementById('editor').value='';currentFolderId='root';renderFolders();loadFiles()} function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
/* ===== اعتماد الإدارة وحفظ الملاحظات ===== */

function approvalKey(){
  return sectionKey('approval');
}

function getApproval(){
  try{
    return JSON.parse(localStorage.getItem(approvalKey()) || '{}');
  }catch(e){
    return {};
  }
}

function saveApproval(){
  const adminName = prompt('اسم المديرة / الوكيلة / المشرفة:');
  if(!adminName) return;

  const note = prompt('اكتبي الملاحظة أو التوجيه:') || '';

  const type = prompt(
    'نوع الإجراء:\n1- مراجعة\n2- اعتماد\n3- توقيع\n4- ختم واعتماد'
  );

  const types = {
    '1':'تمت المراجعة',
    '2':'تم الاعتماد',
    '3':'تم التوقيع',
    '4':'تم الختم والاعتماد'
  };

  if(!types[type]) return;

  const data = {
    name: adminName,
    note: note,
    status: types[type],
    date: new Date().toLocaleString('ar-SA')
  };

  localStorage.setItem(approvalKey(), JSON.stringify(data));

  alert('✅ تم حفظ ' + data.status);
  showApproval();
}

function showApproval(){
  const a = getApproval();

  if(!a.name){
    alert('لا يوجد اعتماد إداري لهذا القسم حتى الآن.');
    return;
  }

  alert(
    '✅ حالة القسم: ' + a.status +
    '\n\nالاسم: ' + a.name +
    '\nالتاريخ: ' + a.date +
    (a.note ? '\n\nالملاحظة:\n' + a.note : '')
  );
}

function removeApproval(){
  if(!confirm('هل تريدين حذف اعتماد هذا القسم؟')) return;

  localStorage.removeItem(approvalKey());
  alert('تم حذف الاعتماد.');
}renderCards();
</script>
</body></html>
